buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        maven { url = 'https://api.modrinth.com/maven' }
    }
    configurations { sophisticatedCoreArtifact }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10.5'
        classpath 'me.modmuss50:mod-publish-plugin:2.1.1'
        sophisticatedCoreArtifact 'maven.modrinth:9jxwkYQL:BP3CQI2v'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'
apply plugin: 'me.modmuss50.mod-publish-plugin'

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-fabric-1.20.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

loom {
    accessWidenerPath = file('src/main/resources/sophisticatedsorter.accesswidener')
}

sourceSets.main.output.dir(
        project(':common').layout.buildDirectory.dir('classes/java/main'),
        builtBy: ':common:classes'
)

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
        content { includeGroupByRegex 'net\\.fabricmc(\\..*)?' }
    }
    maven {
        url = 'https://maven.shedaniel.me/'
        content { includeGroupByRegex 'me\\.shedaniel(\\..*)?' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
    }
}

def sophisticatedCoreCoordinate = 'maven.modrinth:9jxwkYQL:BP3CQI2v'
def sophisticatedCoreArtifact = buildscript.configurations.sophisticatedCoreArtifact
def extractedCoreLibraries = layout.buildDirectory.dir('generated/sophisticatedcore-libs')
def extractSophisticatedCoreLibraries = tasks.register('extractSophisticatedCoreLibraries', Sync) {
    from { zipTree(sophisticatedCoreArtifact.singleFile) }
    include 'META-INF/jars/*.jar'
    into extractedCoreLibraries
}
def extractedTransferLibrary = extractedCoreLibraries.map {
    it.file('META-INF/jars/transfer-2.3.2+1.20.1.jar')
}
if (!extractedTransferLibrary.get().asFile.exists()) {
    copy {
        from zipTree(sophisticatedCoreArtifact.singleFile)
        include 'META-INF/jars/*.jar'
        into extractedCoreLibraries
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation sophisticatedCoreCoordinate
    modImplementation 'maven.modrinth:ouNrBQtq:Jk6o7s4h'
    modImplementation 'maven.modrinth:ohNO6lps:HvR3IdRE'
    modImplementation files(extractedTransferLibrary).builtBy(extractSophisticatedCoreLibraries)
    implementation project(':common')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: fabric_minecraft_version,
            fabric_loader_version: fabric_loader_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            sophisticated_core_version_range: sophisticated_core_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn extractSophisticatedCoreLibraries
    options.encoding = 'UTF-8'
    options.release = 17
}

ext.skipLocalImplementationDependencies = true
apply from: file('../../gradle/target-conventions/publish.gradle')
