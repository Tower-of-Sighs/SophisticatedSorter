buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        maven { url = 'https://cursemaven.com' }
    }
    configurations { sophisticatedCoreArtifact }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10.5'
        classpath 'me.modmuss50:mod-publish-plugin:2.1.1'
        sophisticatedCoreArtifact 'curse.maven:sophisticated-core-unofficial-fabric-port-979317:7341057'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'
apply plugin: 'me.modmuss50.mod-publish-plugin'

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-fabric-1.20.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

loom {
    accessWidenerPath = file('src/main/resources/sophisticatedsorter.accesswidener')
}

sourceSets.main.java.srcDir(project(':common').file('src/main/java'))
sourceSets.main.java.srcDir(project(':common').file('src/minecraft/java'))
sourceSets.main.java.srcDir(project(':common').file('src/fabric/java'))

configurations {
    portingLibArtifact
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
        content { includeGroupByRegex 'net\\.fabricmc(\\..*)?' }
    }
    maven {
        url = 'https://maven.shedaniel.me/'
        content { includeGroupByRegex 'me\\.shedaniel(\\..*)?' }
    }
    maven {
        url = 'https://cursemaven.com'
    }
}

def sophisticatedCoreCoordinate = 'curse.maven:sophisticated-core-unofficial-fabric-port-979317:7341057'
def sophisticatedCoreArtifact = buildscript.configurations.sophisticatedCoreArtifact
def extractedCoreLibraries = layout.buildDirectory.dir('generated/sophisticatedcore-libs')
def extractSophisticatedCoreLibraries = tasks.register('extractSophisticatedCoreLibraries', Sync) {
    from { zipTree(sophisticatedCoreArtifact.singleFile) }
    include 'META-INF/jars/*.jar'
    into extractedCoreLibraries
}
def extractedCoreLibraryJars = files {
    fileTree(extractedCoreLibraries.get().dir('META-INF/jars').asFile) {
        include '*.jar'
    }.files
}
def extractedTransferLibrary = extractedCoreLibraries.map {
    it.file('META-INF/jars/transfer-2.3.2+1.20.1.jar')
}
if (!extractedTransferLibrary.get().asFile.exists()) {
    copy {
        from zipTree(sophisticatedCoreArtifact.singleFile)
        include 'META-INF/jars/*.jar'
        into extractedCoreLibraries
    }
}
def extractedPortingLibLibraries = layout.buildDirectory.dir('generated/porting-lib-libs')
// Core 1.20.1 embeds only part of Porting Lib; add the missing modules from its Curse Maven artifact.
def extractPortingLibLibraries = tasks.register('extractPortingLibLibraries', Sync) {
    from { zipTree(configurations.portingLibArtifact.singleFile) }
    include 'META-INF/jars/*.jar'
    exclude 'META-INF/jars/porting_lib_extensions-*.jar'
    exclude 'META-INF/jars/porting_lib_fluids-*.jar'
    exclude 'META-INF/jars/porting_lib_loot-*.jar'
    exclude 'META-INF/jars/porting_lib_model_loader-*.jar'
    exclude 'META-INF/jars/porting_lib_networking-*.jar'
    exclude 'META-INF/jars/porting_lib_tool_actions-*.jar'
    exclude 'META-INF/jars/porting_lib_transfer-*.jar'
    into extractedPortingLibLibraries
}
def extractedPortingLibLibraryJars = files {
    fileTree(extractedPortingLibLibraries.get().dir('META-INF/jars').asFile) {
        include '*.jar'
    }.files
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation sophisticatedCoreCoordinate
    modImplementation 'curse.maven:sophisticated-backpacks-unofficial-fabric-port-979322:7147929'
    modImplementation 'curse.maven:forge-config-api-port-547434:7260491'
    portingLibArtifact 'curse.maven:porting-lib-696251:5245141'
    modImplementation files(extractedTransferLibrary).builtBy(extractSophisticatedCoreLibraries)
    modRuntimeOnly extractedCoreLibraryJars.builtBy(extractSophisticatedCoreLibraries)
    modRuntimeOnly extractedPortingLibLibraryJars.builtBy(extractPortingLibLibraries)
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: fabric_minecraft_version,
            fabric_loader_version: fabric_loader_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            sophisticated_core_version_range: sophisticated_core_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn extractSophisticatedCoreLibraries
    dependsOn extractPortingLibLibraries
    options.encoding = 'UTF-8'
    options.release = 17
}

ext.skipLocalImplementationDependencies = true
apply from: file('../../gradle/target-conventions/publish.gradle')
