plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets.main.java.srcDir(project(':common').file('src/main/java'))
sourceSets.main.java.srcDir(project(':common').file('src/minecraft/java'))
sourceSets.main.java.srcDir(project(':common').file('src/itemstack/java'))

neoForge {
    version = neoforge_121_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation 'curse.maven:sophisticated-core-618298:8705083'
    implementation 'curse.maven:sophisticated-backpacks-422301:8687841'
}

repositories {
    maven { url = 'file:///D:/work/SophisticatedSorter/.local-curse-repo' }
    mavenCentral()
    maven { url = 'https://cursemaven.com' }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: neoforge_121_minecraft_version,
            neoforge_version: neoforge_121_version,
            neoforge_version_range: neoforge_121_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            sophisticated_core_version_range: sophisticated_core_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('../../gradle/target-conventions/publish.gradle')
