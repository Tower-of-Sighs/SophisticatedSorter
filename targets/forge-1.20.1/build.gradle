buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply plugin: 'org.spongepowered.mixin'

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-forge-1.20.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: forge_minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file('run')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.java.srcDir(project(':common').file('src/main/java'))

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}"
    implementation fg.deobf('maven.modrinth:nmoqTijg:caACbM4f')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'sophisticatedsorter.refmap.json'
    config 'sophisticatedsorter.mixins.json'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes('MixinConfigs': 'sophisticatedsorter.mixins.json')
    }
}

tasks.named('jar').configure {
    finalizedBy 'reobfJar'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: forge_minecraft_version,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: forge_loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            sophisticated_core_version_range: sophisticated_core_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('../../gradle/target-conventions/publish.gradle')
